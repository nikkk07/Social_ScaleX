<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>Social ScaleX | Social Media Marketing Agency in Delhi NCR</title>
    <meta
      name="description"
      content="Social ScaleX grows brands on Instagram, Facebook & YouTube — 9.3M+ monthly views, 496K+ followers managed. Delhi NCR agency, verified client results."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="Social ScaleX" />
    <meta name="theme-color" content="#050508" />

    <!--
      The canonical host is the Vercel deployment URL, NOT a custom domain —
      no custom domain is registered yet. A canonical pointing at a host that
      does not serve the site tells Google to index that host instead, which
      means the site is indexed nowhere.

      WHEN A REAL DOMAIN IS BOUGHT: replace social-scalex.vercel.app in this
      file (canonical, og:url, og:image, twitter:image, and all five JSON-LD
      @id/url/publisher fields), public/robots.txt and public/sitemap.xml —
      13 references in total. Change them together; a canonical on one host
      and JSON-LD @id on another splits the entity across two URIs.
      See docs/MERGE_CHECKLIST.md §7.
    -->
    <link rel="canonical" href="https://social-scalex.vercel.app/" />

    <!-- Open Graph (Facebook / WhatsApp / LinkedIn previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Social ScaleX" />
    <meta property="og:title" content="Social ScaleX | Social Media Marketing Agency in Delhi NCR" />
    <meta
      property="og:description"
      content="Instagram, Facebook & YouTube growth for brands and creators. 9.3M+ monthly views, 496K+ followers managed. Real clients, verified results."
    />
    <meta property="og:url" content="https://social-scalex.vercel.app/" />
    <meta property="og:image" content="https://social-scalex.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Social ScaleX | Social Media Marketing Agency in Delhi NCR" />
    <meta
      name="twitter:description"
      content="Instagram, Facebook & YouTube growth for brands and creators. Real clients, verified results."
    />
    <meta name="twitter:image" content="https://social-scalex.vercel.app/og-image.png" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts: connect early so text renders without a swap flash -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Structured data: who we are, what we do, where -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "ProfessionalService",
          "@id": "https://social-scalex.vercel.app/#organization",
          "name": "Social ScaleX",
          "description": "Social media marketing agency in Delhi NCR managing Instagram, Facebook and YouTube for brands and creators — content production, page management, paid advertising and analytics.",
          "url": "https://social-scalex.vercel.app/",
          "telephone": "+91-80777-27669",
          "priceRange": "₹₹",
          "areaServed": [
            { "@type": "Place", "name": "Delhi NCR" },
            { "@type": "Country", "name": "India" }
          ],
          "address": {
            "@type": "PostalAddress",
            "addressRegion": "Delhi NCR",
            "addressCountry": "IN"
          },
          "knowsAbout": [
            "Social media marketing",
            "Instagram growth",
            "YouTube channel management",
            "Facebook advertising",
            "Reels production",
            "Influencer marketing",
            "Content creation"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://social-scalex.vercel.app/#website",
          "url": "https://social-scalex.vercel.app/",
          "name": "Social ScaleX",
          "publisher": { "@id": "https://social-scalex.vercel.app/#organization" },
          "inLanguage": "en-IN"
        }
      ]
    }
    </script>

    <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
