name: Supabase keepalive

# ─────────────────────────────────────────────────────────────────────
# Supabase pauses a free-tier project after roughly 7 days of insufficient
# DATABASE activity, and the free plan has no backup retention. Traffic to the
# marketing site does not count — it is static files off Vercel's CDN and never
# touches Postgres. This job performs a real database write via
# public.ping_keepalive().
#
# ⚠️  THIS WORKFLOW CAN DIE SILENTLY. ⚠️
#
# GitHub disables scheduled workflows in a repository with roughly 60 days of
# no commit activity. It does not fail — it simply stops running, and the only
# notice is an email to the repo admin that is easy to miss. If this repo goes
# quiet over a holiday, the keepalive stops, and Supabase pauses a few days
# later. Restoring a paused project is manual (see docs/DEPLOYMENT.md), and on
# the free plan there are no backups behind it.
#
# MITIGATION — set up a second line of defence that does not depend on this
# repo being active. An independent external monitor hitting the same RPC:
#
#   cron-job.org (free) or UptimeRobot (free tier):
#     Method:  POST
#     URL:     https://<project-ref>.supabase.co/rest/v1/rpc/ping_keepalive
#     Headers: apikey: <anon key>
#              Authorization: Bearer <anon key>
#              Content-Type: application/json
#     Body:    {}
#     Every:   3 days
#
# The anon key is public by design (it ships in the JS bundle), and
# ping_keepalive is the only thing anon may execute, so putting it in a
# third-party monitor grants that monitor nothing it could not already do.
#
# If the schedule ever does lapse, `workflow_dispatch` below runs it by hand
# from the Actions tab.
# ─────────────────────────────────────────────────────────────────────

on:
  schedule:
    # Every 3 days at 06:17 UTC. Deliberately not on the hour: GitHub's
    # scheduler is busiest at :00 and delays queued jobs there.
    - cron: "17 6 */3 * *"
  workflow_dispatch:

# Read-only token. This job needs nothing from the repo beyond its own source.
permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Ping the database
        env:
          # Repository secrets — Settings → Secrets and variables → Actions.
          # NOT the VITE_-prefixed pair; those are Vercel's, for the browser.
          # The anon key is correct and sufficient here: ping_keepalive() is
          # SECURITY DEFINER with EXECUTE granted to anon. service_role must
          # never be added to this repo or these secrets.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Optional. Leave the secret unset unless a Render service exists.
          RENDER_URL: ${{ secrets.RENDER_URL }}
        run: python scripts/keep_alive.py
